name: 镜像官方扩展全集

on:
  schedule:
    # 每小时第 15 分（UTC）= 北京时间每小时 :15，官方更新后最长约 1 小时可见
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成镜像目录
        run: node mirror.mjs catalog-mirror.json

      - name: 无变化则退出
        id: diff
        run: |
          if git diff --quiet -- catalog-mirror.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "镜像无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "=== 变化 ==="
            git diff --unified=0 -- catalog-mirror.json | head -60
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "conflux-mirror-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-mirror.json
          git commit -m "mirror: 同步官方扩展 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
